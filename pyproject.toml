[project]
name = "sputtertwin"
version = "0.1.0"
description = "Physics-Informed AI Digital Twin for DC Magnetron Sputtering"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"
